<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container nav-inner">

    <div class="logo" (click)="scrollTo('hero')">
      <div class="logo-icon"><i class='bx bx-code-alt'></i></div>
      <span class="logo-text">Dev<span class="hl">Craft</span></span>
    </div>

    <ul class="nav-links" [class.open]="menuOpen">
      <li *ngFor="let link of navLinks">
        <a (click)="scrollTo(link.href)">{{ link.label }}</a>
      </li>
      <li class="mobile-cta">
        <button class="nav-hire-btn" (click)="scrollTo('contact')">
          Hire Us <i class='bx bx-right-arrow-alt'></i>
        </button>
      </li>
    </ul>

    <div class="nav-actions">
      <button class="nav-hire-btn desktop" (click)="scrollTo('contact')">
        Hire Us <i class='bx bx-right-arrow-alt'></i>
      </button>
      <button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</nav>
