<section id="contact" class="contact-section">
  <div class="container">
    <div class="section-header">
      <div class="badge-pill"><i class='bx bx-mail-send'></i> Contact</div>
      <h2>Let's Build Something <span class="grad-text">Amazing</span></h2>
      <p>Got a project? Tell us about it. We typically respond within 4 hours.</p>
    </div>

    <div class="contact-layout">
      <!-- LEFT INFO -->
      <div class="contact-info">
        <div class="info-card">
          <h3>Why Work With Us?</h3>
          <div class="why-list">
            <div class="why-item" *ngFor="let item of [
              'Full-stack team under one roof',
              'Transparent pricing & timelines',
              'Weekly progress updates',
              'Code ownership & documentation',
              'Post-launch support included',
              '4–5 years of hands-on expertise each']">
              <div class="chk"><i class='bx bx-check'></i></div>
              <span>{{ item }}</span>
            </div>
          </div>
        </div>

        <div class="channel-list">
          <a class="channel" *ngFor="let ch of channels" href="#">
            <div class="ch-icon" [style.color]="ch.color">
              <i class='bx {{ ch.icon }}'></i>
            </div>
            <div>
              <strong>{{ ch.label }}</strong>
              <span>{{ ch.value }}</span>
            </div>
            <i class='bx bx-right-arrow-alt ch-arrow'></i>
          </a>
        </div>

        <div class="response-badge">
          <div class="pulse-dot"></div>
          <span>Avg. response time: <strong>4 hours</strong></span>
        </div>
      </div>

      <!-- RIGHT FORM -->
      <div class="form-wrap">
        <div class="success-state" *ngIf="submitted">
          <div class="success-icon"><i class='bx bx-check-circle'></i></div>
          <h3>Message Sent! 🎉</h3>
          <p>Thanks! We'll review your project and get back to you within 24 hours.</p>
          <button class="cta-ghost" (click)="resetForm()">Send Another</button>
        </div>

        <form class="contact-form" *ngIf="!submitted" (ngSubmit)="onSubmit()">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name *</label>
              <div class="input-wrap">
                <i class='bx bx-user inp-icon'></i>
                <input type="text" placeholder="John Doe" [(ngModel)]="form.name" name="name" required>
              </div>
            </div>
            <div class="form-group">
              <label>Email *</label>
              <div class="input-wrap">
                <i class='bx bx-envelope inp-icon'></i>
                <input type="email" placeholder="john@company.com" [(ngModel)]="form.email" name="email" required>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Service Needed</label>
              <div class="input-wrap">
                <i class='bx bx-cog inp-icon'></i>
                <select [(ngModel)]="form.service" name="service">
                  <option value="">Select a service…</option>
                  <option *ngFor="let s of services" [value]="s">{{ s }}</option>
                </select>
                <i class='bx bx-chevron-down sel-arrow'></i>
              </div>
            </div>
            <div class="form-group">
              <label>Project Budget</label>
              <div class="input-wrap">
                <i class='bx bx-dollar inp-icon'></i>
                <select [(ngModel)]="form.budget" name="budget">
                  <option value="">Select budget range…</option>
                  <option *ngFor="let b of budgets" [value]="b">{{ b }}</option>
                </select>
                <i class='bx bx-chevron-down sel-arrow'></i>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Project Description *</label>
            <div class="input-wrap textarea-wrap">
              <i class='bx bx-message-square-detail inp-icon'></i>
              <textarea rows="5" placeholder="Tell us about your goals, timeline and any requirements…"
                        [(ngModel)]="form.message" name="message" required></textarea>
            </div>
          </div>

          <button type="submit" class="cta-primary submit-btn" [disabled]="loading">
            <ng-container *ngIf="!loading">
              <i class='bx bx-send'></i> <span>Send Project Brief</span>
            </ng-container>
            <ng-container *ngIf="loading">
              <span class="spinner"></span> <span>Sending…</span>
            </ng-container>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
