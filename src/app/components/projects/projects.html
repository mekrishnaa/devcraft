<section id="projects" class="projects-section">
  <div class="noise"></div>

  <div class="container">
    <div class="section-header">
      <div class="badge-pill"><i class='bx bx-briefcase'></i> Our Work</div>
      <h2>Projects That <span class="grad-text">Speak Volumes</span></h2>
      <p>A curated selection of products we've built — from MVPs to enterprise platforms.</p>
    </div>

    <div class="filter-bar">
      <button *ngFor="let f of filters"
              class="filter-btn" [class.active]="activeFilter === f"
              (click)="setFilter(f)">{{ f }}</button>
    </div>

    <div class="projects-grid">
      <div class="project-card" *ngFor="let p of filteredProjects">
        <div class="project-header" [style.background]="p.gradient">
          <i class='bx {{ p.icon }}'></i>
          <span class="project-cat">{{ p.category }}</span>
        </div>
        <div class="project-body">
          <h3>{{ p.title }}</h3>
          <p>{{ p.description }}</p>
          <div class="metrics">
            <div class="metric" *ngFor="let m of p.metrics">
              <strong [style.color]="p.color">{{ m.value }}</strong>
              <span>{{ m.label }}</span>
            </div>
          </div>
          <div class="project-tags">
            <span *ngFor="let t of p.tags">{{ t }}</span>
          </div>
          <a [href]="p.link" class="project-link">
            View Case Study <i class='bx bx-right-arrow-alt'></i>
          </a>
        </div>
      </div>
    </div>

    <div class="cta-banner">
      <div class="cta-left">
        <div class="cta-icon"><i class='bx bx-rocket'></i></div>
        <div>
          <h3>Have a project in mind?</h3>
          <p>Let's build something remarkable together.</p>
        </div>
      </div>
      <button class="cta-primary" (click)="scrollTo('contact')">
        <span>Start Your Project</span>
        <i class='bx bx-right-arrow-alt'></i>
      </button>
    </div>
  </div>
</section>
